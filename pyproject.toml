[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c2-traffic-analyzer"
description = "Detect C2 beaconing in Zeek conn.log and map findings to MITRE ATT&CK"
authors = [
  {name = "Leo", email = "leetschau@gmail.com"},
]

version = "0.1.0"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

dependencies = [
  "Jinja2>=3.1.4",
  "PyYaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "ipython",
  "polars>=1.3.0",
  "pandas",
  "matplotlib",
  "zat",
  "pyarrow",
  "pytest>=8.0",
]

[project.urls]
Repository = "https://github.com/leetschau/attack-traffic-generator"

[project.scripts]
tranalyzer = "c2_traffic_analyzer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
